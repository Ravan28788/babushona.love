<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yuvi & Misty — Live Wallpaper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090312;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    /* Full-screen Live Wallpaper Container */
    .live-wallpaper-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1d0936 0%, #07020d 100%);
    }

    /* Animated Image Layer (Hug & Kiss Live Motion) */
    .wallpaper-media {
      position: absolute;
      inset: -4%;
      width: 108%;
      height: 108%;
      object-fit: cover;
      object-position: center;
      transform-origin: center center;
      will-change: transform, filter;
      animation: liveHugKissMotion 7s ease-in-out infinite;
    }

    /* Subtle breathing, gentle hug/kiss sway & zoom like a live wallpaper */
    @keyframes liveHugKissMotion {
      0% {
        transform: scale(1.03) translate(0px, 0px) rotate(0deg);
        filter: brightness(1) contrast(1.02) saturate(1.05);
      }
      25% {
        transform: scale(1.07) translate(-8px, -5px) rotate(-0.4deg);
        filter: brightness(1.05) contrast(1.04) saturate(1.12);
      }
      50% {
        transform: scale(1.05) translate(6px, -3px) rotate(0.35deg);
        filter: brightness(1.03) contrast(1.03) saturate(1.08);
      }
      75% {
        transform: scale(1.08) translate(8px, 4px) rotate(0.45deg);
        filter: brightness(1.06) contrast(1.05) saturate(1.14);
      }
      100% {
        transform: scale(1.03) translate(0px, 0px) rotate(0deg);
        filter: brightness(1) contrast(1.02) saturate(1.05);
      }
    }

    /* Soft Neon Glow Ambient Overlay */
    .neon-ambient {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 28% 22%, rgba(0, 170, 255, 0.16), transparent 40%),
        radial-gradient(circle at 72% 22%, rgba(255, 45, 155, 0.18), transparent 42%),
        radial-gradient(circle at 50% 65%, rgba(255, 105, 180, 0.10), transparent 55%);
      mix-blend-mode: screen;
      animation: ambientPulse 4s ease-in-out infinite alternate;
    }

    @keyframes ambientPulse {
      0% { opacity: 0.65; }
      100% { opacity: 1; }
    }

    /* Top Full-Width Neon Header Stage (Replaces static image text dynamically) */
    .top-neon-stage {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 125px;
      z-index: 25;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 4vw;
      background: radial-gradient(ellipse 95% 100% at 50% 0%, rgba(9, 3, 18, 0.98) 0%, rgba(9, 3, 18, 0.92) 55%, rgba(9, 3, 18, 0.65) 80%, transparent 100%);
      backdrop-filter: blur(10px);
      pointer-events: none;
      user-select: none;
    }

    .neon-name-slot {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .neon-name-slot.boy-slot {
      justify-content: flex-end;
      padding-right: 22px;
    }

    .neon-name-slot.girl-slot {
      justify-content: flex-start;
      padding-left: 22px;
    }

    .neon-crown {
      font-size: clamp(1.4rem, 2.6vw, 2.4rem);
      filter: drop-shadow(0 0 12px #ffd700);
      animation: crownBounce 2.5s infinite ease-in-out alternate;
    }

    @keyframes crownBounce {
      0% { transform: translateY(0) rotate(-6deg); }
      100% { transform: translateY(-4px) rotate(6deg); }
    }

    .neon-cursive {
      font-family: 'Great Vibes', 'Dancing Script', cursive;
      font-size: clamp(2.4rem, 5.5vw, 4.5rem);
      font-weight: 700;
      letter-spacing: 1.5px;
      white-space: nowrap;
      line-height: 1.1;
    }

    /* Boy Name Neon Glow (Electric Cyan / Royal Blue) */
    .name-yuvi {
      color: #ffffff;
      text-shadow:
        0 0 4px #ffffff,
        0 0 10px #00f2fe,
        0 0 20px #00d2d3,
        0 0 40px #0984e3,
        0 0 80px #0984e3;
      animation: neonFlickerBlue 3.6s infinite alternate;
    }

    /* Center Neon Heart */
    .neon-heart-slot {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 70px;
    }

    .neon-main-heart {
      font-size: clamp(2rem, 4.5vw, 3.8rem);
      color: #ff2a70;
      text-shadow:
        0 0 8px #ff758c,
        0 0 22px #ff2a70,
        0 0 45px #e84393;
      animation: heartBeat 1.4s ease-in-out infinite;
    }

    /* Girl Name Neon Glow (Radiant Hot Pink / Magenta) */
    .name-misty {
      color: #ffffff;
      text-shadow:
        0 0 4px #ffffff,
        0 0 10px #ff758c,
        0 0 20px #ff2a70,
        0 0 40px #e84393,
        0 0 80px #e84393;
      animation: neonFlickerPink 3.2s infinite alternate;
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      30% { transform: scale(1.22); }
      60% { transform: scale(0.96); }
    }

    @keyframes neonFlickerBlue {
      0%, 100% { opacity: 1; }
      92% { opacity: 0.92; }
      95% { opacity: 1; }
    }

    @keyframes neonFlickerPink {
      0%, 100% { opacity: 1; }
      90% { opacity: 0.94; }
      94% { opacity: 1; }
    }

    /* Floating Hearts Layer */
    .hearts-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 10;
    }

    .floating-heart {
      position: absolute;
      bottom: -40px;
      color: #ff66c4;
      text-shadow: 0 0 10px #ff2a9d, 0 0 20px #ff2a9d;
      animation: floatUp linear forwards;
      user-select: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) translateX(0) scale(0.7) rotate(0deg);
        opacity: 0;
      }
      15% {
        opacity: 0.9;
      }
      80% {
        opacity: 0.85;
      }
      100% {
        transform: translateY(-110vh) translateX(var(--drift, 25px)) scale(1.25) rotate(18deg);
        opacity: 0;
      }
    }

    /* Back Button to Card */
    .back-to-card-btn {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      border-radius: 999px;
      background: rgba(255, 42, 112, 0.9);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 0 20px rgba(255, 42, 112, 0.6);
      backdrop-filter: blur(8px);
      transition: all 0.25s ease;
    }
    .back-to-card-btn:hover {
      background: #ff0055;
      transform: translateX(-50%) scale(1.06);
    }
  </style>
</head>
<body>
  <!-- Top Neon Couple Stage (Dynamically replaces static image text with glowing neon cursive) -->
  <header class="top-neon-stage" aria-label="Couple Live Wallpaper">
    <div class="neon-name-slot boy-slot">
      <span class="neon-crown">👑</span>
      <span class="neon-cursive name-yuvi" id="neonBoyName">Yuvi</span>
    </div>

    <div class="neon-heart-slot">
      <span class="neon-main-heart" id="neonHeart">♥</span>
    </div>

    <div class="neon-name-slot girl-slot">
      <span class="neon-cursive name-misty" id="neonGirlName">Misty</span>
      <span class="neon-crown">👑</span>
    </div>
  </header>

  <!-- Floating Hearts Container -->
  <div class="hearts-layer" id="heartsLayer"></div>

  <!-- Live Wallpaper Stage -->
  <main class="live-wallpaper-stage">
    <img
      src="./images/yuvi_misty_theme_bg.jpg?v=5"
      alt="Yuvi and Misty Hugging and Kissing Live Wallpaper"
      class="wallpaper-media"
    />
    <div class="neon-ambient"></div>
  </main>

  <a href="index.html" class="back-to-card-btn">🌸 Back to Birthday Card 💖</a>

  <script>
    // Dynamic Profile & Name Configuration
    (function() {
      const params = new URLSearchParams(window.location.search);
      let toName = params.get('to') || params.get('name') || params.get('girl') || params.get('recipientName');
      let fromName = params.get('from') || params.get('sender') || params.get('boy') || params.get('senderName');
      let customBg = null;

      // 1. Check compact base64 payload (?pdata=...)
      const pdata = params.get('pdata');
      if (pdata) {
        try {
          const decoded = JSON.parse(decodeURIComponent(escape(atob(pdata))));
          if (decoded) {
            if (decoded.name || decoded.recipientName) toName = decoded.name || decoded.recipientName;
            if (decoded.sender || decoded.senderName) fromName = decoded.sender || decoded.senderName;
            if (decoded.customPhotos?.themeBackground || decoded.themeBg || decoded.bg) {
              customBg = decoded.customPhotos?.themeBackground || decoded.themeBg || decoded.bg;
            }
          }
        } catch (_) {}
      }

      // 2. Check profile key (?p=... or ?profile=...)
      const pId = params.get('p') || params.get('profile');
      if (pId) {
        try {
          const db = JSON.parse(localStorage.getItem('yuvi_profiles_db') || '{}');
          const p = db[pId.toLowerCase()];
          if (p) {
            toName = p.name || p.recipientName || toName;
            fromName = p.sender || p.senderName || fromName;
            if (p.customPhotos?.themeBackground || p.customPhotos?.bgTheme || p.customPhotos?.bg || p.themeBg || p.bg) {
              customBg = p.customPhotos?.themeBackground || p.customPhotos?.bgTheme || p.customPhotos?.bg || p.themeBg || p.bg;
            }
          }
        } catch (_) {}
      }

      // 3. Check active profile in localStorage
      if (!toName || !fromName) {
        try {
          const activeId = localStorage.getItem('yuvi_active_profile_id');
          const db = JSON.parse(localStorage.getItem('yuvi_profiles_db') || '{}');
          if (activeId && db[activeId]) {
            const p = db[activeId];
            if (!toName) toName = p.name || p.recipientName;
            if (!fromName) fromName = p.sender || p.senderName;
            if (!customBg && (p.customPhotos?.themeBackground || p.customPhotos?.bgTheme || p.customPhotos?.bg || p.themeBg || p.bg)) {
              customBg = p.customPhotos?.themeBackground || p.customPhotos?.bgTheme || p.customPhotos?.bg || p.themeBg || p.bg;
            }
          }
          if (!toName || !fromName) {
            const cfg = JSON.parse(localStorage.getItem('yuvi_admin_config') || '{}');
            if (!toName && cfg.recipientName) toName = cfg.recipientName;
            if (!fromName && cfg.senderName) fromName = cfg.senderName;
            if (!customBg && (cfg.customPhotos?.themeBackground || cfg.customPhotos?.bgTheme || cfg.customPhotos?.bg || cfg.themeBg || cfg.bg)) {
              customBg = cfg.customPhotos?.themeBackground || cfg.customPhotos?.bgTheme || cfg.customPhotos?.bg || cfg.themeBg || cfg.bg;
            }
          }
        } catch (_) {}
      }

      toName = toName || 'Misty';
      fromName = fromName || 'Yuvi';

      // Update DOM with dynamic profile names
      const stage = document.querySelector('.top-neon-stage');
      if (stage) stage.setAttribute('aria-label', `${fromName} and ${toName} Live Wallpaper`);

      const elYuvi = document.getElementById('neonBoyName') || document.querySelector('.name-yuvi');
      if (elYuvi) elYuvi.textContent = fromName;

      const elMisty = document.getElementById('neonGirlName') || document.querySelector('.name-misty');
      if (elMisty) elMisty.textContent = toName;

      document.title = `${fromName} & ${toName} — Live Wallpaper`;

      if (customBg) {
        const img = document.querySelector('.wallpaper-media');
        if (img) img.src = customBg;
      }

      const backBtn = document.querySelector('.back-to-card-btn');
      if (backBtn) {
        backBtn.textContent = `🌸 Back to ${toName}'s Celebration Card 💖`;
        backBtn.href = window.location.search ? `index.html${window.location.search}` : 'index.html';
      }
    })();

    const heartsLayer = document.getElementById("heartsLayer");
    const heartSymbols = ["♥", "♡", "💕", "💖"];

    function spawnHeart() {
      const heart = document.createElement("span");
      heart.className = "floating-heart";
      heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];

      const leftPos = Math.random() * 100;
      const size = 14 + Math.random() * 18;
      const duration = 4.5 + Math.random() * 4;
      const drift = (Math.random() - 0.5) * 90 + "px";

      heart.style.left = leftPos + "%";
      heart.style.fontSize = size + "px";
      heart.style.animationDuration = duration + "s";
      heart.style.setProperty("--drift", drift);

      heartsLayer.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, duration * 1000);
    }

    // Initial hearts + continuous gentle spawn
    for (let i = 0; i < 8; i++) {
      setTimeout(spawnHeart, i * 350);
    }
    setInterval(spawnHeart, 750);
  </script>
</body>
</html>
